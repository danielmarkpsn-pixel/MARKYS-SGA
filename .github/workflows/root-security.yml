name: Root security checks

on:
  push:
    branches:
      - main
      - security/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: root-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check markys-auth.js
          node --check markys-cloud.js
          node --check api/public-queue.js
          node --check security-regression-check.mjs
      - name: Run root security regression checks
        run: node security-regression-check.mjs
      - name: Validate Vercel configuration
        run: node -e "JSON.parse(require('node:fs').readFileSync('vercel.json', 'utf8'))"
