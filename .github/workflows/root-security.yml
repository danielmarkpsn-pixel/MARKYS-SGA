name: Root security checks

on:
  push:
    branches:
      - main
      - security/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: root-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-auth:
    name: Syntax — authentication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check markys-auth.js

  syntax-cloud:
    name: Syntax — cloud client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check markys-cloud.js

  syntax-public-api:
    name: Syntax — public queue API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check api/public-queue.js

  regression:
    name: Security regression assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node security-regression-check.mjs

  vercel-config:
    name: Vercel configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node -e "JSON.parse(require('node:fs').readFileSync('vercel.json', 'utf8'))"
