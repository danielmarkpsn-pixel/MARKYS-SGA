name: MARKYS SGA CI

on:
  push:
    branches: [main, setup/markys-sga-cloud]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Security and syntax checks
        run: npm run check
      - name: Production build
        run: npm run build
