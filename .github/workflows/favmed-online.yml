name: MARKYS SGA CI

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "consultorio.html"
      - "financeiro.html"
      - "admin-logins.html"
      - "importar-backup.html"
      - "markys-*.js"
      - "api/**"
      - "consultorio/**"
      - "sala/**"
      - "supabase/**"
      - "vercel.json"
      - "package.json"
      - "scripts/**"
      - "online/**"
      - ".github/workflows/favmed-online.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "consultorio.html"
      - "financeiro.html"
      - "admin-logins.html"
      - "importar-backup.html"
      - "markys-*.js"
      - "api/**"
      - "consultorio/**"
      - "sala/**"
      - "supabase/**"
      - "vercel.json"
      - "package.json"
      - "scripts/**"
      - "online/**"
      - ".github/workflows/favmed-online.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-root-app:
    name: Validate MARKYS SGA root application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check markys-cloud.js
          node --check markys-auth.js
          node --check api/public-queue.js
          node --check scripts/check-security-basics.mjs

      - name: Validate HTML inline scripts and MARKYS routes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import vm from "node:vm";

          for (const file of ["index.html", "consultorio.html", "financeiro.html", "admin-logins.html", "importar-backup.html", "consultorio/index.html", "sala/index.html"]) {
            const html = readFileSync(file, "utf8");
            let index = 0;
            for (const match of html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)) {
              const source = match[1].trim();
              if (source) new vm.Script(source, { filename: file + "#inline-" + index });
              index += 1;
            }
          }

          const reception = readFileSync("index.html", "utf8");
          const professional = readFileSync("consultorio.html", "utf8");
          const professionalRoute = readFileSync("consultorio/index.html", "utf8");
          const finance = readFileSync("financeiro.html", "utf8");
          const auth = readFileSync("markys-auth.js", "utf8");
          const admin = readFileSync("admin-logins.html", "utf8");
          if (!reception.includes("MARKYS SGA")) throw new Error("Identidade MARKYS SGA ausente na recepção.");
          if (!professional.includes("MARKYS SGA")) throw new Error("Identidade MARKYS SGA ausente no painel profissional.");
          if (!finance.includes("MARKYS SGA") || !finance.includes("markys_finance_entries")) throw new Error("Módulo Financeiro MARKYS incompleto.");
          if (!auth.includes("Acesso restrito à Administração da clínica e ao Master.") || !auth.includes("admin_clinica")) throw new Error("Controle de acesso da Administração ausente.");
          if (!admin.includes('value="admin_clinica"') || admin.includes('<option value="financeiro">')) throw new Error("Matriz de perfis oficiais incorreta: Administração deve existir e Financeiro não pode ser criado.");
          const masterUsers = readFileSync("supabase/functions/master-users/index.ts", "utf8");
          if (!masterUsers.includes('new Set(["recepcao", "profissional", "admin_clinica"])')) throw new Error("A Edge Function não valida os três perfis oficiais.");
          if (!reception.includes("/consultorio.html")) throw new Error("Link para o painel profissional ausente na recepção.");
          if (!professionalRoute.includes("/consultorio.html")) throw new Error("Rota /consultorio não encaminha ao painel profissional.");
          if (!reception.includes("markys-cloud.js") || !reception.includes("markys-auth.js")) throw new Error("Integração MARKYS Cloud/Auth ausente na recepção.");
          if (!professional.includes("markys-cloud.js") || !professional.includes("markys-auth.js")) throw new Error("Integração MARKYS Cloud/Auth ausente no painel profissional.");
          console.log("MARKYS SGA root application checks passed.");
          NODE

      - name: Security basics (segredos, senhas fixas, projeto Supabase, dependências, cabeçalhos)
        run: node scripts/check-security-basics.mjs

      - name: Online (legacy) security guardrails
        run: node online/scripts/security-regression-check.mjs

      - name: Check patch whitespace
        run: git diff --check
